<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản trị sự kiện')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1>Quản trị</h1>
  <nav th:replace="~{fragments :: adminTabs('events')}"></nav>
  <th:block th:replace="~{fragments :: flash}"></th:block>

  <div class="toolbar">
    <a class="btn primary" th:href="@{/admin/events/new}">+ Tạo sự kiện</a>
  </div>

  <div class="card">
    <table th:unless="${events.isEmpty()}">
      <thead><tr><th>Sự kiện</th><th>Bắt đầu</th><th>Đã bán / Tổng ghế</th><th>Trạng thái</th></tr></thead>
      <tbody>
      <tr th:each="e : ${events}" th:with="st=${stats[e.id]}" th:classappend="${e.hasStarted(now)} ? 'dim'">
        <td><a th:href="@{/events/{id}(id=${e.id})}" th:text="${e.name}"></a></td>
        <td th:text="${@fmt.dateTime(e.startTime)}"></td>
        <td th:text="${st == null} ? '0 / 0' : |${st.booked} / ${st.total}|"></td>
        <td>
          <span th:if="${e.hasStarted(now)}" class="tag">Đã diễn ra</span>
          <span th:unless="${e.hasStarted(now)}" class="tag ok">Sắp diễn ra</span>
        </td>
      </tr>
      </tbody>
    </table>
    <p class="muted" th:if="${events.isEmpty()}">Chưa có sự kiện nào.</p>
  </div>
</main>
</body>
</html>
