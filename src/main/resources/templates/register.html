<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <div class="card">
    <h1>Tạo tài khoản</h1>
    <form method="post" th:action="@{/register}" th:object="${form}">
      <label class="field" for="username">Tên đăng nhập</label>
      <input type="text" th:field="*{username}" autocomplete="username" required>
      <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

      <label class="field" for="password">Mật khẩu (ít nhất 8 ký tự)</label>
      <input type="password" th:field="*{password}" autocomplete="new-password" required>
      <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

      <label class="field" for="confirmPassword">Nhập lại mật khẩu</label>
      <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
      <p class="field-error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></p>

      <div class="buttons"><button class="primary wide" type="submit">Đăng ký</button></div>
    </form>
    <p class="muted">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
  </div>
</main>
</body>
</html>
