<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng nhập')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <div class="card">
    <h1>Đăng nhập</h1>
    <div class="flash err" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu.</div>
    <div class="flash ok" th:if="${param.registered}">Đăng ký thành công! Mời bạn đăng nhập.</div>

    <!-- POST /login do Spring Security xử lý; th:action tự thêm CSRF token -->
    <form method="post" th:action="@{/login}">
      <label class="field" for="username">Tên đăng nhập</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label class="field" for="password">Mật khẩu</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <div class="buttons"><button class="primary wide" type="submit">Đăng nhập</button></div>
    </form>
    <p class="muted">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
  </div>
</main>
</body>
</html>
