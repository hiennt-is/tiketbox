<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản trị')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1>Quản trị · Tất cả booking</h1>
  <th:block th:replace="~{fragments :: flash}"></th:block>

  <div class="card">
    <table th:unless="${bookings.isEmpty()}">
      <thead><tr><th>#</th><th>Khách</th><th>Sự kiện</th><th>Ghế</th><th>Đặt lúc</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody>
      <tr th:each="b : ${bookings}" th:classappend="${b.status.name() == 'CANCELLED'} ? 'dim'">
        <td th:text="${b.id}"></td>
        <td th:text="${b.username}"></td>
        <td th:text="${b.eventName}"></td>
        <td><b th:text="${b.seatCode}"></b></td>
        <td th:text="${@fmt.dateTime(b.createdAt)}"></td>
        <td th:text="${b.status}"></td>
        <td>
          <form th:if="${b.status.name() == 'CONFIRMED'}" method="post"
                th:action="@{/admin/bookings/{id}/cancel(id=${b.id})}"
                onsubmit="return confirm('Huỷ vé của khách?')">
            <button class="danger" type="submit">Huỷ</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
    <p class="muted" th:if="${bookings.isEmpty()}">Chưa có booking nào.</p>
  </div>
</main>
</body>
</html>
